name: CC Pages Frontend Publish
# Publish frontend-only changes without invoking the Tencent CN500 scan.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cc-pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload current Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy CC frontend
        id: deployment
        uses: actions/deploy-pages@v4
