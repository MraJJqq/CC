name: CC Pages Frontend Publish
# Publish frontend-only changes without invoking the Tencent CN500 scan.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cc-pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Restore the latest valid A-share data snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          restored=0
          while read -r run_id run_number; do
            [ -n "$run_id" ] || continue
            rm -rf .cc-data-artifact site/data
            if ! gh run download "$run_id" --name "cc-a-share-$run_number" --dir .cc-data-artifact; then
              continue
            fi
            if [ ! -d .cc-data-artifact/site/data ]; then
              continue
            fi
            mkdir -p site
            cp -a .cc-data-artifact/site/data site/data
            if python3 scripts/validate_pages_payload.py; then
              restored=1
              break
            fi
          done < <(gh run list --workflow a-share-daily.yml --status success --limit 30 --json databaseId,number --jq '.[] | "\(.databaseId) \(.number)"')
          if [ "$restored" -ne 1 ]; then
            echo "No valid A-share Pages data snapshot found; refusing to publish an incomplete site."
            exit 1
          fi
      - name: Upload current Pages site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy CC frontend
        id: deployment
        uses: actions/deploy-pages@v4
