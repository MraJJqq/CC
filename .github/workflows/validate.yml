name: CC Validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-and-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install A-share dependencies
        run: pip install -r requirements.txt
      - name: Run backend and frontend contract tests
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: |
          find site/assets -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: |
          npm install --no-package-lock
          npx playwright install --with-deps chromium
      - name: Generate isolated CN500 browser fixtures
        run: python tests/create_browser_fixtures.py
      - name: Verify frontend in Chromium at five viewport sizes
        run: |
          python -m http.server 8765 --directory site >/tmp/cc-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tests/browser-smoke.mjs
