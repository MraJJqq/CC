name: CCN A-share Daily Cache and Publish
# Code pushes do not scan; workflow edits trigger validation of the full pipeline, including browser smoke tests.
# Existing publisher is triggered after CCN background asset updates; source modules stay unchanged.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1-5"
concurrency:
  group: ccn-a-share-daily
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scan-and-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      has-data: ${{ steps.scan.outcome == 'success' && steps.calendar.outputs.is-trading-day == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - name: Test backend data and frontend system contracts
        run: python -m unittest discover -s tests -v
      - name: Check A-share trading calendar
        id: calendar
        run: python scripts/trading_calendar.py --write site/data/trading-calendar.json --github-output "$GITHUB_OUTPUT"
      - name: Restore Tencent CN500 cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/cn500-tencent-qfq
          key: ccn-cn500-tencent-qfq-v4-${{ github.run_id }}
          restore-keys: |
            ccn-cn500-tencent-qfq-v4-
      - name: Backfill or incrementally update Tencent daily history
        id: scan
        if: steps.calendar.outputs.is-trading-day == 'true'
        run: python scripts/a_share_cache.py --workers 4 --cache-dir .cache/cn500-tencent-qfq
      - name: Push CN500 daily signals to Bark
        if: steps.scan.outcome == 'success' && steps.calendar.outputs.is-trading-day == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
        run: python scripts/push_signals.py
      - name: Install browser test runtime
        if: steps.scan.outcome == 'success' && steps.calendar.outputs.is-trading-day == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install Playwright package
        if: steps.scan.outcome == 'success' && steps.calendar.outputs.is-trading-day == 'true'
        run: npm install --no-package-lock --prefer-offline
      - name: Restore Playwright Chromium cache
        if: steps.scan.outcome == 'success' && steps.calendar.outputs.is-trading-day == 'true'
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ccn-playwright-chromium-v1.56.1-ubuntu-24.04
      - name: Install Chromium system dependencies
        if: steps.scan.outcome == 'success' && steps.calendar.outputs.is-trading-day == 'true'
        run: npx playwright install-deps chromium
      - name: Install Playwright Chromium browser
        if: steps.scan.outcome == 'success' && steps.calendar.outputs.is-trading-day == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Verify CCN in a real browser
        if: steps.scan.outcome == 'success' && steps.calendar.outputs.is-trading-day == 'true'
        run: |
          python -m http.server 8765 --directory site >/tmp/cnn-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tests/browser-smoke.mjs
      - name: Validate complete Pages data payload
        if: steps.scan.outcome == 'success' && steps.calendar.outputs.is-trading-day == 'true'
        run: |
          python - <<'PY'
          import gzip
          import json
          from pathlib import Path

          data = Path("site/data")
          required = ("cards.json", "summary.json", "universe.json", "signals.json", "signals.previous.json", "trading-calendar.json")
          missing = [name for name in required if not (data / name).is_file()]
          if missing:
              raise SystemExit(f"Missing Pages data files: {missing}")

          load = lambda name: json.loads((data / name).read_text(encoding="utf-8"))
          cards, summary, universe, signals = (load("cards.json"), load("summary.json"), load("universe.json"), load("signals.json"))
          if len(cards) != 500 or len({row["symbol"] for row in cards}) != 500:
              raise SystemExit("CN500 cards payload must contain exactly 500 unique symbols")
          if summary.get("universe_size") != 500 or summary.get("eligible_count") != len(universe):
              raise SystemExit("CN500 summary and eligible universe counts disagree")
          if summary.get("fetch_error_count") != 0:
              raise SystemExit("Refusing to publish a snapshot with Tencent fetch errors")
          symbols = {row["symbol"] for row in universe}
          if any(row.get("symbol") not in symbols or row.get("confirmation_date") != summary.get("market_date") for row in signals):
              raise SystemExit("Signal payload contains an unknown symbol or non-current session")
          charts = data / "charts"
          chart_files = list(charts.glob("*.json.gz"))
          if len(chart_files) != len(universe):
              raise SystemExit(f"Expected {len(universe)} compressed charts, found {len(chart_files)}")
          for stock in universe:
              path = charts / f'{stock["symbol"]}.json.gz'
              if not path.is_file():
                  raise SystemExit(f"Missing compressed chart: {path.name}")
              with gzip.open(path, "rt", encoding="utf-8") as handle:
                  chart = json.load(handle)
              if chart.get("symbol") != stock["symbol"] or not chart.get("bars"):
                  raise SystemExit(f"Invalid compressed chart payload: {path.name}")
          print(f"Pages payload verified: 500 CN500 cards, {len(universe)} eligible charts, {len(signals)} current-session signals.")
          PY
      - name: Save Tencent cache snapshot
        if: always() && steps.scan.outcome != 'cancelled'
        uses: actions/cache/save@v4
        with:
          path: .cache/cn500-tencent-qfq
          key: ccn-cn500-tencent-qfq-v4-${{ github.run_id }}
      - name: Upload diagnostics and cache manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccn-a-share-${{ github.run_number }}
          path: |
            results/a-share/
            site/data/
          if-no-files-found: warn
          retention-days: 90
      - name: Package Pages site
        if: steps.scan.outcome == 'success' && steps.calendar.outputs.is-trading-day == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: scan-and-cache
    if: needs.scan-and-cache.outputs.has-data == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy CCN to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
